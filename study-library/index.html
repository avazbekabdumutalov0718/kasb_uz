<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORDRUSH · Study Library</title><style>
:root{font-family:Inter,system-ui,Arial;background:#0b1813;color:#f0f9ef}*{box-sizing:border-box}body{margin:0}.app{max-width:1460px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding:16px 0;border-bottom:1px solid #355442}a{color:#c8fa8d}.brand{font-size:25px;font-weight:850}.brand em{color:#d7fd91;font-style:normal}h1{font-size:clamp(27px,5vw,52px);letter-spacing:-2px;line-height:1.1;margin:20px 0}.sub{color:#a4bfac;font-size:14px}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin:28px 0 18px}.tab{border:1px solid #395946;color:#e6f3e8;background:#173023;padding:11px 15px;border-radius:13px;cursor:pointer;font-weight:750}.tab.active{background:#d9ff9a;color:#162818}.layout{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:20px}.list{height:min(74vh,860px);overflow:auto;background:#12291d;border:1px solid #31513c;border-radius:18px;padding:12px}.search{width:100%;background:#0d2016;color:#fff;border:1px solid #46624e;border-radius:11px;padding:14px;outline:0;margin-bottom:8px}.item{width:100%;background:transparent;border:0;border-bottom:1px solid #304c39;color:#e4f4de;text-align:left;display:block;cursor:pointer;padding:14px 9px;font-size:14px;line-height:1.5}.item small{display:block;color:#8aac92}.item.sel{background:#294b32;border-radius:10px}.reader{background:#fdfdf8;color:#233329;border-radius:20px;min-height:70vh;padding:24px 26px}.reader h2{font-size:27px;margin:8px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #d9e4d8;margin-bottom:15px}.toolbar button,.toolbar a,.btn{cursor:pointer;padding:10px 13px;border:1px solid #a6c5a4;background:#ecf7e7;color:#1c3823;border-radius:10px;font-weight:700;text-decoration:none;font-size:13px}.toolbar button.active{background:#d7efab}.page{margin:18px 0;border-left:3px solid #c5dfab;padding:9px 0 9px 17px;white-space:pre-wrap;line-height:1.7;word-wrap:break-word;font-size:15px}.page .num{display:block;font-size:10px;color:#6d856a;font-weight:800;margin-bottom:9px}.readtext::selection{background:#fde487}.page mark{background:#fff298}.exercise{background:#eff7e9;border:1px solid #d0e3c7;border-radius:14px;margin:18px 0;padding:17px}.exercise h3{margin:0 0 9px}.q{margin:12px 0}.q label{display:block;font-size:13px;font-weight:700}.q input{width:100%;max-width:440px;background:white;border:1px solid #aec2ae;padding:10px;border-radius:8px}.feedback{font-size:12px;margin-left:7px}.vocabrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border-bottom:1px solid #cbdac8}.vocabrow button{border:1px solid #bbd1b2;padding:7px;background:white;border-radius:7px;cursor:pointer}.frost{color:#6e8070}.empty{font-size:14px;color:#69816a}.sidePanel{margin-top:28px}.word{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 4px;border-bottom:1px solid #d6e1d1}.word button{background:#fee2df;border:0;border-radius:7px;padding:5px 9px;cursor:pointer}.toast{position:fixed;bottom:18px;right:18px;background:#d6fd99;color:#203523;padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px #0002;display:none}.toast.show{display:block}.video{padding:15px;background:#eaf3e8;border-radius:12px}.video a{display:block;word-break:break-word}.warning{font-size:13px;background:#ffefd0;padding:12px;border-radius:10px}.hide{display:none}@media(max-width:780px){.app{padding:12px}.layout{display:block}.list{height:240px;margin-bottom:15px}.reader{padding:16px}.page{font-size:14px}}
@media print{body{background:white;color:black}.top,.tabs,.list,.toolbar,.no-print{display:none!important}.app,.layout,.reader{padding:0;margin:0;border:0;display:block}.page{break-inside:avoid}}
</style></head><body><div class="app"><header class="top"><div class="brand">WORD<em>RUSH</em> <span class="sub">/ IELTS Study Library</span></div><a href="../index.html">← WORDRUSH</a></header><h1>Read. Practise.<br><span style="color:#d6ff98">Build your vocabulary.</span></h1><p class="sub">61 Articles · 61 Task 2 Model Essays · Examiner Essays · 61 Podcasts · 7 Topic Vocabulary Collections. Source material is shown as extracted and may retain PDF line wrapping.</p><nav class="tabs" id="tabs"></nav><main class="layout"><aside class="list"><input class="search" id="search" placeholder="Search units and titles…"><div id="items"></div></aside><article class="reader"><div id="viewer"></div><section class="sidePanel" id="vocabPanel"></section></article></main></div><div id="toast" class="toast"></div>
<script>
const NAMES={articles:'Articles',essays:'Model Essay · Task 2',examiner:'Examiner Essays · Task 2',podcasts:'Podcast',vocab:'Topic Vocab'};
let sources={},units={},articleKeys={},podcastKeys={},category='articles',selected=1,highlight=false,vocabulary=JSON.parse(localStorage.getItem('wordrush.article.vocab.v1')||'[]');
let notes=JSON.parse(localStorage.getItem('wordrush.notes.v1')||'{}');
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function flash(s){$('#toast').textContent=s;$('#toast').className='toast show';setTimeout(()=>$('#toast').className='toast',2500)}
const pagekey=(c,n)=>c+':'+n;
async function boot(){for(const key of ['articles','essays','examiner','podcasts','vocab']){try{const r=await fetch('data/'+key+'.json');if(!r.ok)throw Error(r.status);sources[key]=await r.json()}catch(e){console.warn(key,e);sources[key]=[]}}try{units=await(await fetch('data/units.json')).json()}catch(e){units={}};try{articleKeys=await(await fetch('data/article-keys.json')).json()}catch(e){articleKeys={}};try{podcastKeys=await(await fetch('data/podcast-keys.json')).json()}catch(e){podcastKeys={}};render()}
function group(){if(['articles','essays','podcasts'].includes(category))return (units[category]||[]).map((x)=>({...x,pages:x.pages||[]}));if(category==='examiner')return sources.examiner.filter(p=>p.p>=6).map(p=>({id:p.p,title:'Examiner Essay — page '+p.p,pages:[p.p]}));return [{id:1,title:'Crime and Punishment',pages:[3,4,5,6,7]},{id:2,title:'Media and Advertising',pages:[8,9,10,11,12,13]},{id:3,title:'The Environment',pages:[14,15,16,17,18,19]},{id:4,title:'Business and Money',pages:[20,21,22,23,24]},{id:5,title:'Government',pages:[25,26,27,28,29]},{id:6,title:'Sport and Exercise',pages:[30,31,32,33,34]},{id:7,title:'Space Exploration',pages:[35,36,37,38]}]}
function render(){const tabs=Object.keys(NAMES);$('#tabs').innerHTML=tabs.map(k=>'<button class="tab '+(k===category?'active':'')+'" data-section="'+k+'">'+NAMES[k]+'</button>').join('');renderList();renderUnit();renderVocab()}
function renderList(){let q=$('#search').value.toLowerCase();let g=group().filter(x=>(x.id+' '+x.title).toLowerCase().includes(q));$('#items').innerHTML=g.map(x=>'<button class="item '+(x.id===selected?'sel':'')+'" data-item="'+x.id+'"><small>'+String(x.id).padStart(2,'0')+' · '+(x.pages||[]).length+' page(s)</small>'+esc(x.title)+'</button>').join('')||'<p class="sub">Nothing found</p>'}
function renderUnit(){const unit=group().find(x=>x.id===selected)||group()[0];if(!unit){$('#viewer').innerHTML='<p>No units found.</p>';return}selected=unit.id;const data=sources[category]||[];let pages=(unit.pages||[]).map(p=>data.find(z=>z.p===p)).filter(Boolean);const links=[...new Set(pages.flatMap(p=>p.links||[]))];let text=pages.map(p=>'<div class="page"><span class="num">ORIGINAL PDF PAGE '+p.p+'</span><div class="readtext" data-page="'+p.p+'">'+esc(p.text)+'</div></div>').join('');let special='';if(category==='podcasts'){
 let key=podcastKeys[selected]||{};
 let form=Object.keys(key).length?'<section class="exercise no-print"><h3>Listening answers · Unit '+selected+'</h3><p>13 ta savolning javoblari kitobdagi answer key bilan tekshiriladi. Faqat kiritilgan javoblar baholanadi.</p>'+Object.keys(key).map(n=>'<div class="q"><label>Question '+n+'</label><input class="podanswer" data-no="'+n+'" placeholder="Your answer"><span class="feedback" data-pfeedback="'+n+'"></span></div>').join('')+'<button class="btn" id="checkPodcast">✓ Check entered answers</button><p class="sub" id="podResult"></p></section>':'';
 special='<section class="video"><strong>Official episode / transcript links</strong><p>Original kitobda berilgan havolalar. Tasdiqlanmagan video embed qilinmaydi.</p>'+links.map(l=>'<a target="_blank" rel="noopener noreferrer" href="'+esc(l)+'">'+esc(l)+'</a>').join('')+'</section>'+form;
 }
if(category==='articles'){
 const k=articleKeys[selected];let form='';
 if(k){form='<section class="exercise no-print"><h3>Practice B · Matching (1–12)</h3><p>Original PDF B sectiondagi har bir so‘zni a–l ma’nosiga moslang. Faqat kiritgan javoblaringiz tekshiriladi.</p>'+Object.keys(k.B).map(n=>'<div class="q"><label>Word '+n+' → meaning letter (a–l)</label><input class="answer" data-task="B" data-no="'+n+'" placeholder="a–l" maxlength="1"><span class="feedback" data-feedback="B-'+n+'"></span></div>').join('')+'<h3>Practice C · Summary (original answer key)</h3><p>Original PDF C sectionidagi bo‘shliqlar uchun javob yozing; kerakli grammatik shaklni saqlang.</p>'+Object.keys(k.C).map(n=>'<div class="q"><label>Gap '+n+'</label><input class="answer" data-task="C" data-no="'+n+'" placeholder="Write answer"><span class="feedback" data-feedback="C-'+n+'"></span></div>').join('')+'<button id="checkArticle" class="btn">✓ Check entered answers</button><p id="checkResult" class="sub"></p></section>'}
 else form='<p class="warning">Bu article uchun javob kaliti ajratilmadi. Noto‘g‘ri baho chiqmasligi uchun avtomatik tekshiruv o‘chirilgan; original PDF’dagi answer key bilan taqqoslang.</p>';
 special='<p class="warning">Highlight: matndan so‘z yoki iborani ajrating. So‘zni Articles Vocab’ga saqlang. Matn va savollar original kitobdan olingan.</p>'+form;
 }
if(category==='essays'||category==='examiner')special='<p class="warning">Task 2 model va original notes / chunks / grammar mashqlari manbadagi tartibda. Erkin yozilgan essay’ga avtomatik Band 9 deb baho qo‘yilmaydi; o‘z javobingizni saqlab solishtirishingiz mumkin.</p>';
if(category==='vocab')special='<p class="warning">Topic Vocab asl kitobdagi ta’rif va misollar bilan ko‘rsatilgan.</p>';
$('#viewer').innerHTML='<small class="frost">'+esc(NAMES[category])+' / UNIT '+unit.id+'</small><h2>'+esc(unit.title)+'</h2><div class="toolbar"><button id="highlight" class="'+(highlight?'active':'')+'">✎ Highlight '+(highlight?'ON':'OFF')+'</button><button id="saveSelection">＋ Save selected phrase</button><button id="print" class="no-print">⎙ Print / Save PDF</button><a href="sources/'+category+'.pdf#page='+((pages[0]||{}).p||1)+'" target="_blank">Original PDF ↗</a></div>'+special+text+'<section class="exercise no-print"><h3>My notes · Writing / Speaking practice</h3><p>O‘z javobingizni kiriting. Matn qurilmangizda avtomatik saqlanadi.</p><textarea id="notes" style="width:100%;min-height:150px;padding:12px;border:1px solid #aac5a8;border-radius:10px" placeholder="Write your notes or essay here...">'+esc(notes[pagekey(category,selected)]||'')+'</textarea><div class="sub">Open-ended answers: self review only. There is no invented automatic score.</div></section>';
}
function saveWord(word){word=word.trim().replace(/\s+/g,' ');if(!word)return flash('So‘z tanlang');if(word.length>130)return flash('130 belgidan qisqa ibora tanlang');if(vocabulary.some(x=>x.w.toLowerCase()===word.toLowerCase()))return flash('Bu ibora avval saqlangan');vocabulary.push({w:word,source:category,unit:selected,meaning:''});persist();renderVocab();flash('Articles Vocab’ga saqlandi ✓')}
function persist(){localStorage.setItem('wordrush.article.vocab.v1',JSON.stringify(vocabulary))}
function renderVocab(){$('#vocabPanel').innerHTML='<div class="toolbar"><h2>Articles Vocab <small class="frost">'+vocabulary.length+' saved</small></h2><button id="printVocab">⎙ Export PDF</button><button id="exportJSON">↧ Backup JSON</button></div>'+(vocabulary.length?vocabulary.map((v,i)=>'<div class="word"><div><strong>'+esc(v.w)+'</strong><small class="frost"> · '+esc(v.source)+' #'+v.unit+'</small><input data-meaning="'+i+'" placeholder="O‘zbekcha tarjima..." value="'+esc(v.meaning)+'" style="display:block;width:100%;border:0;border-bottom:1px solid #cbd6c8;padding:6px;margin-top:4px"></div><button data-delete="'+i+'">✕</button></div>').join(''):'<p class="empty">Select any word or phrase in Articles, then choose “Save selected phrase”.</p>')}
function printableVocab(){const html='<html><head><meta charset="utf-8"><title>WORDRUSH Articles Vocabulary</title><style>body{font:15px/1.5 Arial;margin:35px}h1{color:#164e35}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:10px;text-align:left}</style></head><body><h1>WORDRUSH — Articles Vocab</h1><p>'+vocabulary.length+' saved items</p><table><tr><th>Phrase</th><th>O‘zbekcha</th><th>Source</th></tr>'+vocabulary.map(v=>'<tr><td>'+esc(v.w)+'</td><td>'+esc(v.meaning)+'</td><td>'+esc(v.source)+' #'+v.unit+'</td></tr>').join('')+'</table></body></html>';const w=window.open('','_blank');if(!w)return flash('Popup ruxsat bering');w.document.write(html);w.document.close();setTimeout(()=>w.print(),300)}
function download(data,name,mime){const b=new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-section],[data-item],[data-delete],#highlight,#saveSelection,#print,#printVocab,#exportJSON,#checkArticle,#checkPodcast');if(!t)return;if(t.dataset.section){category=t.dataset.section;selected=1;history.replaceState(null,'','#'+category);render()}else if(t.dataset.item){selected=+t.dataset.item;renderList();renderUnit();window.scrollTo(0,0)}else if(t.dataset.delete){vocabulary.splice(+t.dataset.delete,1);persist();renderVocab()}else if(t.id==='highlight'){highlight=!highlight;renderUnit()}else if(t.id==='saveSelection'){saveWord(String(window.getSelection()))}else if(t.id==='print'){window.print()}else if(t.id==='checkPodcast'){const key=podcastKeys[selected]||{};let correct=0,attempted=0;document.querySelectorAll('.podanswer').forEach(input=>{const val=input.value.trim(),f=document.querySelector('[data-pfeedback="'+input.dataset.no+'"]');if(!val){f.textContent='';return}attempted++;const clean=x=>String(x).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();const ok=String(key[input.dataset.no]||'').split(' / ').some(z=>clean(z)===clean(val));if(ok)correct++;f.textContent=ok?'✓ Correct':'✗ Check again';f.style.color=ok?'#26713d':'#b54a31'});$('#podResult').textContent='Checked '+attempted+' entered answers: '+correct+' correct; unanswered questions not checked.';}else if(t.id==='checkArticle'){const key=articleKeys[selected];let correct=0,attempted=0;document.querySelectorAll('.answer').forEach(input=>{const val=input.value.trim();const f=document.querySelector('[data-feedback="'+input.dataset.task+'-'+input.dataset.no+'"]');if(!val){f.textContent='';return}attempted++;const ans=key[input.dataset.task][input.dataset.no];const clean=x=>String(x).toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9]+/g,' ').trim();const choices=String(ans).split(' / ');const ok=choices.some(v=>clean(v)===clean(val));if(ok)correct++;f.textContent=ok?'✓ Correct':'✗ Check again';f.style.color=ok?'#26713d':'#b54a31'});$('#checkResult').textContent='Checked only '+attempted+' selected answers: '+correct+' correct. Unanswered questions were not checked.';}else if(t.id==='printVocab'){printableVocab()}else if(t.id==='exportJSON'){download(JSON.stringify(vocabulary,null,2),'wordrush-articles-vocab.json','application/json')}});
document.addEventListener('mouseup',e=>{if(!highlight)return;const sel=window.getSelection();if(!sel||sel.isCollapsed||!e.target.closest('.readtext'))return;try{const r=sel.getRangeAt(0),s=String(sel).trim();if(!s||s.length>300)return;const mark=document.createElement('mark');r.surroundContents(mark);sel.removeAllRanges()}catch{flash('Bitta so‘z yoki bitta oddiy iborani ajrating')}});
document.addEventListener('input',e=>{if(e.target.id==='notes'){notes[pagekey(category,selected)]=e.target.value;localStorage.setItem('wordrush.notes.v1',JSON.stringify(notes))}if(e.target.dataset.meaning!==undefined){vocabulary[+e.target.dataset.meaning].meaning=e.target.value;persist()}});
category=Object.keys(NAMES).includes(location.hash.slice(1))?location.hash.slice(1):'articles';boot();
</script></body></html>
